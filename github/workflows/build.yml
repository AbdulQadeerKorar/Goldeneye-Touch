name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch Mupen64Plus-Next GLES3 cores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fL 'https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mupen64plus_next_gles3_libretro_android.so.zip' -o /tmp/core64.zip
          curl -fL 'https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/mupen64plus_next_gles3_libretro_android.so.zip' -o /tmp/core32.zip
          unzip -l /tmp/core64.zip
          unzip -l /tmp/core32.zip
          unzip -j -o /tmp/core64.zip '*.so' -d app/src/main/jniLibs/arm64-v8a
          unzip -j -o /tmp/core32.zip '*.so' -d app/src/main/jniLibs/armeabi-v7a
          test -n "$(find app/src/main/jniLibs/arm64-v8a -name '*.so' -print -quit)"
          test -n "$(find app/src/main/jniLibs/armeabi-v7a -name '*.so' -print -quit)"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goldeneye-touch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
