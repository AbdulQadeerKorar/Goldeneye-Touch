name: Build GoldenEye Touch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;26.3.11579264"

      - name: Extract project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            unzip -oq "$ZIP_FILE" -d extracted
            if [ -f extracted/gradlew ]; then
              cp -a extracted/. .
            else
              PROJECT_DIR="$(find extracted -type f -name gradlew -print -quit)"
              if [ -z "$PROJECT_DIR" ]; then
                echo "ERROR: No gradlew found in project ZIP"
                exit 1
              fi
              PROJECT_DIR="${PROJECT_DIR%/gradlew}"
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

      - name: Verify project files
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Download Mupen64Plus-Next cores
        run: |
          set -e
          BASE="https://buildbot.libretro.com/nightly/android/latest"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          curl -fL "$BASE/arm64-v8a/mupen64plus_next_libretro_android.so" \
            -o app/src/main/jniLibs/arm64-v8a/libmupen64plus_next_libretro.so

          curl -fL "$BASE/armeabi-v7a/mupen64plus_next_libretro_android.so" \
            -o app/src/main/jniLibs/armeabi-v7a/libmupen64plus_next_libretro.so

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenEyeTouch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
