
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout Nin64 emulator
        uses: actions/checkout@v4
        with:
          repository: izzy2lost/Nin64-Emulator
          ref: main
          path: upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "ERROR: sdkmanager was not found after SDK setup."
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.30.3"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses \
            || true

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Check Android tools
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_NDK_HOME"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          java -version
          sdkmanager --version

      - name: Patch app name
        run: python3 scripts/patch_app_label.py upstream

      - name: Build native emulator core
        working-directory: upstream
        run: bash scripts/build_mupen64plus_next_android.sh

      - name: Build release APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          find upstream -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} dist/ \;

          if ! find dist -name '*.apk' -print -quit | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goldeneye-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
